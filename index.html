<!doctype html>
<html lang="en" data-theme="light" data-accent="default" data-design>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ArcGIS Nova app</title>
    <script src="./locale.js"></script>
    <link rel="stylesheet" href="https://js.arcgis.com/5.1.3/esri/themes/light/main.css" />
    <link rel="stylesheet" href="./app.css" />
    <style id="app-design">
:root[data-design] .calcite-mode-light {
  --calcite-color-background: #f7f1df;
  --calcite-color-foreground-1: #fdfaf0;
  --calcite-color-foreground-2: #eee6d1;
  --calcite-color-text-1: #072311;
  --calcite-color-text-2: #4d5d4c;
  --calcite-color-border-1: #c7c9b8;
  --calcite-color-brand: #1f6a19;
  --calcite-color-brand-hover: #1b5d16;
  --calcite-color-brand-press: #185113;
  --calcite-color-text-inverse: #f8f5ea;
  --app-chrome: #0b3d20;
  --app-chrome-text: #f7f1df;
  --app-chrome-accent: #c3dba6;
  --calcite-color-foreground-3: color-mix(in srgb, var(--calcite-color-foreground-2) 95%, var(--calcite-color-text-1));
  --calcite-color-text-3: color-mix(in srgb, var(--calcite-color-text-2) 85%, var(--calcite-color-foreground-1));
  --calcite-color-border-2: color-mix(in srgb, var(--calcite-color-border-1) 75%, var(--calcite-color-foreground-1));
  --calcite-color-border-3: color-mix(in srgb, var(--calcite-color-border-1) 50%, var(--calcite-color-foreground-1));
  --calcite-color-border-input: color-mix(in srgb, var(--calcite-color-border-1) 60%, var(--calcite-color-text-1));
  --app-chrome-muted: color-mix(in srgb, var(--app-chrome-text) 76%, var(--app-chrome));
  --app-chrome-border: color-mix(in srgb, var(--app-chrome-text) 24%, var(--app-chrome));
  --app-chrome-block: transparent;
  --app-header-figure: var(--app-chrome-accent);
  --app-header-link: var(--app-chrome-text);
  --app-series-1: #1f6a19;
  --app-series-2: #8160b5;
  --app-series-3: #aa5f04;
  --app-series-4: #3377be;
  --app-series-5: #b3543b;
  --app-series-6: #2d828a;
  --app-series-7: #af4f71;
  --app-series-8: #8b703a;
}
:root[data-design] .calcite-mode-dark {
  --calcite-color-background: #001b0d;
  --calcite-color-foreground-1: #032615;
  --calcite-color-foreground-2: #143423;
  --calcite-color-text-1: #eee7d8;
  --calcite-color-text-2: #93ad98;
  --calcite-color-border-1: #2c5440;
  --calcite-color-brand: #cae430;
  --calcite-color-brand-hover: #d0e749;
  --calcite-color-brand-press: #d7ea62;
  --calcite-color-text-inverse: #012111;
  --calcite-color-foreground-3: color-mix(in srgb, var(--calcite-color-foreground-2) 95%, var(--calcite-color-text-1));
  --calcite-color-text-3: color-mix(in srgb, var(--calcite-color-text-2) 85%, var(--calcite-color-foreground-1));
  --calcite-color-border-2: color-mix(in srgb, var(--calcite-color-border-1) 75%, var(--calcite-color-foreground-1));
  --calcite-color-border-3: color-mix(in srgb, var(--calcite-color-border-1) 50%, var(--calcite-color-foreground-1));
  --calcite-color-border-input: color-mix(in srgb, var(--calcite-color-border-1) 60%, var(--calcite-color-text-1));
  --app-series-1: #cae430;
  --app-series-2: #ada3ff;
  --app-series-3: #888500;
  --app-series-4: #59bbfb;
  --app-series-5: #e4a249;
  --app-series-6: #29d5e4;
  --app-series-7: #f98e88;
  --app-series-8: #63c98e;
}
:root[data-design] {
  --app-font: Optima, Candara, "Trebuchet MS", "Microsoft YaHei", "PingFang SC", sans-serif;
  --app-heading-size: 17px;
  --app-gap: 16px;
  --app-pad: 16px;
  --app-radius: 2px;
  --app-overlay-opacity: 0.92;
  --app-overlay-blur: 16px;
  --app-control-radius: 1px;
  --app-block-pad: 16px;
  --app-type-scale: 1.0769;
}
:root[data-design] .app-block {
  --calcite-font-line-height-relative-snug: 1.5;
}
:root[data-design] body {
  --calcite-font-family: Optima, Candara, "Trebuchet MS", "Microsoft YaHei", "PingFang SC", sans-serif;
  font-size: 14px;
  line-height: 1.5;
}
:root[data-design] #app-title {
  font-size: min(32px, 8vw);
  font-weight: 500;
  letter-spacing: -0.005em;
}
:root[data-design] .app-region-title,
:root[data-design] .app-block-title {
  font-size: 17px;
}
:root[data-design] body {
  --app-figure-color: var(--app-accent);
}
:root[data-design] #app-title,
:root[data-design] .app-page-section-title,
:root[data-design] .app-region-title,
:root[data-design] .app-block-title {
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Microsoft YaHei", "PingFang SC", serif;
}
:root[data-design] .app-block-value {
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Microsoft YaHei", "PingFang SC", serif;
  font-size: max(2.25rem, calc(var(--app-heading-size, 0px) + 16px));
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.05;
}
:root[data-design] .app-region-header .app-block-value {
  font-size: max(1.6rem, calc(var(--app-heading-size, 0px) + 8px));
}
    </style>
  </head>
  <body class="calcite-mode-light">
    <header class="app-header" id="app-header" hidden>
      <div class="app-identity">
        <h1 id="app-title"></h1>
        <p id="app-subtitle" hidden></p>
      </div>
      <section class="app-region app-region-header" id="app-region-header" hidden></section>
    </header>
    <main class="app-main">
      <aside class="app-region app-region-left" id="app-region-left" hidden></aside>
      <div id="app-view"></div>
      <aside class="app-region app-region-right" id="app-region-right" hidden></aside>
    </main>
    <footer class="app-region app-region-footer" id="app-region-footer" hidden></footer>
    <p id="app-error" hidden></p>
    <script type="module" src="https://js.arcgis.com/5.1.3/"></script>
    <script type="module" src="./standalone-auth.js"></script>
  </body>
</html>
